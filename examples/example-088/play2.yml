---

- hosts: localhost

  vars:

    ansible_python_interpreter: auto_silent

  vars_files:
    - data2.yml

  tasks:

    - debug:
        var: routes

    - debug:
        var: item
      loop: "{{ routes | groupby('interface') }}"


    - set_fact:
        route1: "{{ route1 | d([]) +
                    [{item.0: item.1 | map(attribute='route_array')
                                     | list
                                     | flatten}] }}"
      loop: "{{ routes | groupby('interface') }}"

    - debug:
        var: route1
