---
- name: Parse Cisco Switch Stack Boot Variables
  hosts: localhost
  gather_facts: false

  vars:

    raw_cli_output: |
      ---------------------------
      Switch 1
      ---------------------------
      Current Boot Variables:
      BOOT variable = flash:packages_01.conf;

      Boot Variables on next reload:
      BOOT variable = flash:packages_02.conf;
      Manual Boot = no
      ---------------------------
      Switch 2
      ---------------------------
      Current Boot Variables:
      BOOT variable = flash:packages_A.conf;

      Boot Variables on next reload:
      BOOT variable = flash:packages_B.conf;
      Manual Boot = yes
      Enable Break = no

  tasks:

    - name: Parse output using TextFSM
      register: boot_info
      ansible.utils.cli_parse:
        text: "{{ raw_cli_output }}"
        parser:
          name: ansible.utils.textfsm
          template_path: "{{ playbook_dir }}/templates/parse_boot.textfsm"

    - name: Display structured result
      ansible.builtin.debug:
        var: boot_info.parsed

    - name: Display dictionary
      vars:
        _keys: "{{ boot_info.parsed | map(attribute='SWITCH_ID') }}"
        ios_boot_system: "{{ dict(_keys | zip(boot_info.parsed)) }}"
      ansible.builtin.debug:
        var: ios_boot_system


